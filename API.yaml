openapi: 3.0.3
info:
  title: eVoteFace API
  description: |
    Decentralized Voting System with Face Recognition & Blockchain (Ethereum Sepolia).
    
    ## Authentication
    Most endpoints require a Bearer JWT token in the Authorization header.
    - Voter token: obtained from POST /api/auth/login
    - Admin token: obtained from POST /api/auth/admin/login
    
    ## Voting Flow
    1. Voter registers → Admin approves → Admin uploads face photo → Admin registers wallet on-chain
    2. During voting phase: Voter connects MetaMask → Face verification → OTP verification → Cast vote on blockchain → Record vote
    
    ## Base URL
    http://localhost:5000/api
  version: 1.0.0
  contact:
    name: eVoteFace
servers:
  - url: http://localhost:5000/api
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    Voter:
      type: object
      properties:
        _id:
          type: string
        fullName:
          type: string
        email:
          type: string
        voterID:
          type: string
        aadharNumber:
          type: string
        age:
          type: integer
        gender:
          type: string
          enum: [Male, Female, Other]
        address:
          type: string
        state:
          type: string
        city:
          type: string
        pincode:
          type: string
        contactNumber:
          type: string
        role:
          type: string
          enum: [voter, admin]
        elections:
          type: array
          items:
            $ref: '#/components/schemas/ElectionParticipation'
        createdAt:
          type: string
          format: date-time

    ElectionParticipation:
      type: object
      properties:
        electionId:
          type: string
        walletAddress:
          type: string
          nullable: true
        facePhotoUrl:
          type: string
          nullable: true
        isVerified:
          type: boolean
        isRegisteredOnChain:
          type: boolean
        hasVoted:
          type: boolean
        votedAt:
          type: string
          format: date-time
          nullable: true

    Election:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        contractAddress:
          type: string
        adminId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        phase:
          type: string
          enum: [registration, voting, completed]
        createdAt:
          type: string
          format: date-time

    ElectionWithStats:
      allOf:
        - $ref: '#/components/schemas/Election'
        - type: object
          properties:
            stats:
              type: object
              properties:
                candidateCount:
                  type: integer
                voterCount:
                  type: integer
                votedCount:
                  type: integer

    ElectionPublic:
      allOf:
        - $ref: '#/components/schemas/Election'
        - type: object
          properties:
            candidates:
              type: array
              items:
                $ref: '#/components/schemas/Candidate'
            voterCount:
              type: integer

    Candidate:
      type: object
      properties:
        _id:
          type: string
        electionId:
          type: string
        name:
          type: string
        partyName:
          type: string
        partySymbol:
          type: string
          description: Cloudinary URL of party symbol image
        onChainId:
          type: integer

    VoterStatus:
      type: object
      properties:
        isRegistered:
          type: boolean
        isVerified:
          type: boolean
        walletAddress:
          type: string
          nullable: true
        walletConnected:
          type: boolean
        facePhotoUrl:
          type: string
          nullable: true
        faceRequired:
          type: boolean
        isRegisteredOnChain:
          type: boolean
        hasVoted:
          type: boolean
        votedAt:
          type: string
          format: date-time
          nullable: true
        electionPhase:
          type: string
          enum: [registration, voting, completed]

    ElectionResult:
      type: object
      properties:
        election:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            phase:
              type: string
            startTime:
              type: string
              format: date-time
            endTime:
              type: string
              format: date-time
        candidates:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              party:
                type: string
              partySymbol:
                type: string
              voteCount:
                type: string
        winner:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            party:
              type: string
            voteCount:
              type: string
        totalVotesCast:
          type: string

    AdminElectionResult:
      type: object
      properties:
        election:
          $ref: '#/components/schemas/Election'
        candidates:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              party:
                type: string
              voteCount:
                type: string
        winner:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            party:
              type: string
            voteCount:
              type: string
        stats:
          type: object
          properties:
            totalVotesCast:
              type: string
            totalVoters:
              type: integer
            votedCount:
              type: integer
            turnoutPercentage:
              type: string

    AdminVoter:
      type: object
      properties:
        _id:
          type: string
        fullName:
          type: string
        email:
          type: string
        voterID:
          type: string
        age:
          type: integer
        gender:
          type: string
        contactNumber:
          type: string
        electionData:
          $ref: '#/components/schemas/ElectionParticipation'

paths:

  # ─── AUTH ───────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Register new voter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, voterID, aadharNumber, age, gender, address, state, city, pincode, contactNumber]
              properties:
                fullName:
                  type: string
                  example: Pramod Deore
                email:
                  type: string
                  format: email
                  example: pramod@example.com
                password:
                  type: string
                  minLength: 6
                  example: password123
                voterID:
                  type: string
                  example: VTR001
                aadharNumber:
                  type: string
                  example: "123456789012"
                age:
                  type: integer
                  minimum: 18
                  example: 25
                gender:
                  type: string
                  enum: [Male, Female, Other]
                address:
                  type: string
                  example: 123 Main Street
                state:
                  type: string
                  example: Maharashtra
                city:
                  type: string
                  example: Nashik
                pincode:
                  type: string
                  example: "422001"
                contactNumber:
                  type: string
                  example: "9876543210"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration successful. Please wait for admin approval.
                  user:
                    $ref: '#/components/schemas/Voter'
        '400':
          description: Validation error or duplicate fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Voter login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voterID, password]
              properties:
                voterID:
                  type: string
                  example: VTR001
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Bearer token (expires in 7d)
                  user:
                    $ref: '#/components/schemas/Voter'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@evoteface.com
                password:
                  type: string
                  example: adminpassword
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Bearer token
                  admin:
                    type: object
                    properties:
                      _id:
                        type: string
                      fullName:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        example: admin
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current logged-in user or admin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voter'
        '401':
          description: Unauthorized

  # ─── PUBLIC ELECTIONS ───────────────────────────────────────────────────────

  /elections:
    get:
      tags: [Elections - Public]
      summary: Get all public elections (registration, voting, upcoming)
      responses:
        '200':
          description: List of elections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Election'

  /elections/{electionId}:
    get:
      tags: [Elections - Public]
      summary: Get election details with candidates and voter count
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectionPublic'
        '404':
          description: Election not found

  # ─── ADMIN ELECTIONS ────────────────────────────────────────────────────────

  /admin/elections:
    get:
      tags: [Admin - Elections]
      summary: Get all elections with stats (admin view)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of elections with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElectionWithStats'
    post:
      tags: [Admin - Elections]
      summary: Create new election (deploys smart contract on Sepolia)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, startTime, endTime]
              properties:
                title:
                  type: string
                  example: Presidential Election 2025
                description:
                  type: string
                  example: Annual presidential election
                startTime:
                  type: string
                  format: date-time
                  example: "2025-04-18T00:00:00.000Z"
                endTime:
                  type: string
                  format: date-time
                  example: "2025-04-21T00:00:00.000Z"
      responses:
        '201':
          description: Election created and contract deployed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  election:
                    $ref: '#/components/schemas/Election'
                  txHash:
                    type: string
                    description: Blockchain transaction hash
        '400':
          description: Validation error

  /admin/elections/{electionId}/phase:
    post:
      tags: [Admin - Elections]
      summary: Change election phase
      description: |
        Phase transitions allowed:
        - registration → voting (forward)
        - voting → completed (forward)
        - voting → registration (backward, only if 0 votes cast)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase:
                  type: string
                  enum: [registration, voting, completed]
      responses:
        '200':
          description: Phase changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  election:
                    $ref: '#/components/schemas/Election'
                  txHash:
                    type: string
        '400':
          description: Invalid phase transition

  /admin/elections/{electionId}/results:
    get:
      tags: [Admin - Elections]
      summary: Get election results (admin view, from blockchain)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminElectionResult'

  # ─── ADMIN CANDIDATES ───────────────────────────────────────────────────────

  /admin/elections/{electionId}/candidates:
    get:
      tags: [Admin - Candidates]
      summary: Get all candidates for election
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
    post:
      tags: [Admin - Candidates]
      summary: Add candidate to election (uploads symbol to Cloudinary, registers on blockchain)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, partyName, partySymbol]
              properties:
                name:
                  type: string
                  example: Alice Johnson
                partyName:
                  type: string
                  example: Progressive Party
                partySymbol:
                  type: string
                  format: binary
                  description: Party symbol image file
      responses:
        '201':
          description: Candidate added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  candidate:
                    $ref: '#/components/schemas/Candidate'
                  txHash:
                    type: string
        '400':
          description: Validation error or wrong phase

  /admin/elections/{electionId}/candidates/{candidateId}:
    delete:
      tags: [Admin - Candidates]
      summary: Remove candidate from election (removes from blockchain too)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
          description: MongoDB _id of candidate
      responses:
        '200':
          description: Candidate removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  txHash:
                    type: string
        '400':
          description: Wrong phase or candidate not found

  # ─── ADMIN VOTERS ───────────────────────────────────────────────────────────

  /admin/elections/{electionId}/voters:
    get:
      tags: [Admin - Voters]
      summary: Get all voters registered for election
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of voters with election-specific data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminVoter'

  /admin/elections/{electionId}/voters/{userId}/approve:
    post:
      tags: [Admin - Voters]
      summary: Approve voter for election
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voter approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                      fullName:
                        type: string
                      email:
                        type: string

  /admin/elections/{electionId}/voters/{userId}/register-onchain:
    post:
      tags: [Admin - Voters]
      summary: Register voter wallet on blockchain (election must be in registration phase)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress]
              properties:
                walletAddress:
                  type: string
                  example: "0xEb65271b8EEB19150dA7940dF3a746ee20c2fAe0"
      responses:
        '200':
          description: Voter registered on blockchain
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  txHash:
                    type: string
                  walletAddress:
                    type: string
        '400':
          description: Wrong phase, already registered, or invalid wallet

  /admin/elections/{electionId}/voters/{userId}/face:
    post:
      tags: [Admin - Voters]
      summary: Upload voter face photo (stored on Cloudinary)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [facePhoto]
              properties:
                facePhoto:
                  type: string
                  format: binary
      responses:
        '200':
          description: Face photo uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  facePhotoUrl:
                    type: string
                    description: Cloudinary URL

  /admin/elections/{electionId}/voters/{userId}:
    delete:
      tags: [Admin - Voters]
      summary: Remove voter from election
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voter removed
        '400':
          description: Cannot remove voter who has already voted

  # ─── VOTER ENDPOINTS ────────────────────────────────────────────────────────

  /voters/profile:
    get:
      tags: [Voter]
      summary: Get voter profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Voter profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voter'

  /voters/elections:
    get:
      tags: [Voter]
      summary: Get all elections voter is registered in (with userStatus per election)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Elections with voter status
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Election'
                    - type: object
                      properties:
                        userStatus:
                          $ref: '#/components/schemas/ElectionParticipation'

  /voters/elections/{electionId}/status:
    get:
      tags: [Voter]
      summary: Get voter status for specific election
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voter status for election
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoterStatus'

  /voters/elections/{electionId}/request-registration:
    post:
      tags: [Voter]
      summary: Request registration for an election (voter submits wallet address)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress]
              properties:
                walletAddress:
                  type: string
                  description: Voter's MetaMask wallet address (must not be admin wallet)
                  example: "0xEb65271b8EEB19150dA7940dF3a746ee20c2fAe0"
      responses:
        '200':
          description: Registration request submitted, pending admin approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  electionId:
                    type: string
                  walletAddress:
                    type: string
        '400':
          description: Already registered, invalid wallet, or admin wallet used

  /voters/elections/{electionId}/wallet:
    post:
      tags: [Voter]
      summary: Update wallet address for election (voter must be approved first)
      security:
        - BearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress]
              properties:
                walletAddress:
                  type: string
                  example: "0xEb65271b8EEB19150dA7940dF3a746ee20c2fAe0"
      responses:
        '200':
          description: Wallet address saved
        '400':
          description: Not registered, not approved, or wallet already in use

  # ─── FACE VERIFICATION ──────────────────────────────────────────────────────

  /face/verify:
    post:
      tags: [Voting Flow]
      summary: Verify voter face using DeepFace (Step 2 of voting)
      description: |
        Compares live webcam image with registered face photo via Python DeepFace service.
        Returns a short-lived faceVerifiedToken (5 min) on success.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liveImageBase64, electionId]
              properties:
                liveImageBase64:
                  type: string
                  description: Base64 encoded JPEG image from webcam
                electionId:
                  type: string
      responses:
        '200':
          description: Face verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  match:
                    type: boolean
                  confidence:
                    type: number
                  distance:
                    type: number
                  message:
                    type: string
                  faceVerifiedToken:
                    type: string
                    description: JWT token valid for 5 minutes (only present if match=true)
        '400':
          description: Not registered, not approved, or no face photo
        '503':
          description: Python face service unavailable

  # ─── OTP ────────────────────────────────────────────────────────────────────

  /otp/send:
    post:
      tags: [Voting Flow]
      summary: Send OTP to voter email (Step 3 of voting, requires faceVerifiedToken)
      description: |
        Rate limited to 3 requests per 10 minutes per voter per election.
        OTP expires in 5 minutes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [faceVerifiedToken, electionId]
              properties:
                faceVerifiedToken:
                  type: string
                  description: Token received from POST /face/verify
                electionId:
                  type: string
      responses:
        '200':
          description: OTP sent to voter email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  email:
                    type: string
                    description: Masked email (e.g. pr***@gmail.com)
                  expiresIn:
                    type: integer
                    description: Seconds until OTP expires (300)
        '401':
          description: Invalid or expired face verification token
        '429':
          description: Too many OTP requests

  /otp/verify:
    post:
      tags: [Voting Flow]
      summary: Verify OTP and get vote authorization token (Step 3 complete)
      description: |
        Returns a short-lived voteAuthToken (2 minutes) used to record the vote.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, electionId]
              properties:
                code:
                  type: string
                  description: 6-digit OTP code
                  example: "123456"
                electionId:
                  type: string
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  message:
                    type: string
                  voteAuthToken:
                    type: string
                    description: JWT token valid for 2 minutes to authorize vote recording
        '400':
          description: Invalid or expired OTP

  # ─── VOTES ──────────────────────────────────────────────────────────────────

  /votes/record:
    post:
      tags: [Voting Flow]
      summary: Record vote after blockchain transaction (Step 4 complete)
      description: |
        Called AFTER the voter has cast their vote on the blockchain via MetaMask.
        Verifies the transaction on-chain and marks voter as having voted in MongoDB.
        Requires voteAuthToken from POST /otp/verify.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [electionId, candidateId, txHash, voteAuthToken]
              properties:
                electionId:
                  type: string
                candidateId:
                  type: integer
                  description: On-chain candidate ID
                txHash:
                  type: string
                  description: Blockchain transaction hash from MetaMask
                  example: "0xabc123..."
                voteAuthToken:
                  type: string
                  description: Token from POST /otp/verify
      responses:
        '200':
          description: Vote recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  txHash:
                    type: string
                  votedAt:
                    type: string
                    format: date-time
        '400':
          description: Already voted, invalid transaction, or wrong wallet
        '401':
          description: Invalid vote authorization token

  /votes/results/{electionId}:
    get:
      tags: [Votes]
      summary: Get live/final election results from blockchain (public)
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election results from blockchain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectionResult'
        '404':
          description: Election not found

tags:
  - name: Auth
    description: Voter and admin authentication
  - name: Elections - Public
    description: Public election browsing (no auth required)
  - name: Admin - Elections
    description: Admin election management (create, phase control, results)
  - name: Admin - Candidates
    description: Admin candidate management
  - name: Admin - Voters
    description: Admin voter management (approve, face upload, blockchain registration)
  - name: Voter
    description: Voter-specific endpoints (profile, elections, registration requests)
  - name: Voting Flow
    description: "3-factor voting: Face → OTP → Blockchain vote"
  - name: Votes
    description: Vote recording and results
