name: Keep MongoDB Atlas Alive

on:
  schedule:
    # Runs every 5 minutes — keeps Atlas free tier active 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install mongoose
        run: npm install mongoose

      - name: Ping MongoDB Atlas
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          node -e "
          const mongoose = require('mongoose');
          const uri = process.env.MONGODB_URI;
          if (!uri) { console.error('MONGODB_URI secret not set'); process.exit(1); }
          mongoose.connect(uri, { serverSelectionTimeoutMS: 10000 })
            .then(async () => {
              console.log('✅ MongoDB Atlas is alive - ' + new Date().toISOString());
              await mongoose.connection.db.admin().ping();
              console.log('✅ Ping successful');
              await mongoose.disconnect();
              process.exit(0);
            })
            .catch(err => {
              console.error('❌ MongoDB connection failed:', err.message);
              process.exit(1);
            });
          "
